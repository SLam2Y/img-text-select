<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Unbounded'; src: url('../../src/fonts/unbounded-cyrillic.woff2') format('woff2'); font-weight: 200 900; unicode-range: U+0400-045F; }
  @font-face { font-family: 'Unbounded'; src: url('../../src/fonts/unbounded-latin.woff2') format('woff2'); font-weight: 200 900; }
  html, body { margin: 0; }
  .tile { width: 440px; height: 280px; box-sizing: border-box; padding: 34px 32px; position: relative; overflow: hidden;
    background: #1E2147; color: #FBFBFE; display: grid; align-content: end; gap: 10px;
    font-family: 'Unbounded', sans-serif; }
  .tile::before { content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(251,251,254,.2) 1.6px, transparent 2px); background-size: 9px 9px;
    -webkit-mask: linear-gradient(210deg, #000 10%, transparent 60%); }
  img { position: absolute; right: 28px; top: 26px; width: 96px; }
  h1 { margin: 0; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; position: relative; }
  p { margin: 0; font-weight: 500; font-size: 15px; line-height: 1.3; color: #1E2147; background: #FFD93D;
      justify-self: start; padding: 4px 10px; border-radius: 4px; position: relative; }
</style>
<div class="tile" id="tile">
  <img src="../../icons/icon-128.png" alt="">
  <h1>Image Text<br>Select</h1>
  <p>Выделяй текст на картинках</p>
</div>
